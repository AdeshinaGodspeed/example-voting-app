name: Deploy Voting App

on:
  workflow_dispatch:
  push:
   branches
     - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Voting App

    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Docker
        run: docker --version
      - name: Verify kubectl
        run: kubectl version --client
      - name: Verify Helm
        run: helm version
      - name: Build Vote images
        run: docker build -t voting-vote:latest ./vote
      - name: Build Result images
        run: docker build -t voting-result:latest ./result
      - name: Build Worker images
        run: docker build -t voting-worker:latest ./worker