name: Deploy Voting App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build, Scan and Deploy Voting App

    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment tools
        run: |
          docker --version
          kubectl version --client
          helm version

      - name: Build Vote image
        run: docker build -t voting-vote:latest ./vote

      - name: Build Result image
        run: docker build -t voting-result:latest ./result

      - name: Build Worker image
        run: docker build -t voting-worker:latest ./worker

      - name: Install Trivy if missing
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=30
            sudo apt-get install -y wget
            wget -q https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.68.2_Linux-64bit.deb -O /tmp/trivy.deb
            sudo apt-get install -y /tmp/trivy.deb
          fi
      - name: Scan images for vulnerabilities
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 voting-vote:latest
          trivy image --severity HIGH,CRITICAL --exit-code 1 voting-result:latest
          trivy image --severity HIGH,CRITICAL --exit-code 1 voting-worker:latest

      - name: Load images into Kind
        run: |
          kind load docker-image voting-vote:latest --name capstone
          kind load docker-image voting-result:latest --name capstone
          kind load docker-image voting-worker:latest --name capstone

      - name: Deploy with Helm
        run: |
          helm upgrade --install voting-app ./helm/voting-app \
          --namespace capstone-app \
          --wait \
          --timeout 5m