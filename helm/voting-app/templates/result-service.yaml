apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    app: result
spec:
  type: {{ .Values.result.service.type }}
  ports:
    - name: result-service
      port: {{ .Values.result.service.port }}
      targetPort: 80
      nodePort: {{ .Values.result.service.nodePort }}
  selector:
    app: result